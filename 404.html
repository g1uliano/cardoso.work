<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Giuliano Cardoso</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
  try {
    const t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root[data-theme="dark"]  { --bg:#0d1117; --bg-soft:#161b22; --line:#30363d; --text:#e6edf3; --text-dim:#9da7b3; --accent:#7ee787; --err:#ffa657; }
  :root[data-theme="light"] { --bg:#fbfaf7; --bg-soft:#f2efe8; --line:#d0cbbe; --text:#1c1b17; --text-dim:#4a4840; --accent:#1a7f37; --err:#bc4c00; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', ui-monospace, monospace; }
  main { width: 100%; max-width: 640px; }
  .term { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 24px; line-height: 1.7; overflow-wrap: anywhere; }
  .prompt { color: var(--accent); }
  .err { color: var(--err); }
  .dim { color: var(--text-dim); }
  a { display: inline-block; margin-top: 24px; padding: 10px 16px; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); text-decoration: none; font-weight: 600; }
  a:hover { background: var(--accent); color: var(--bg); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1 class="term" style="font-size:inherit;font-weight:400">
    <span class="prompt">$</span> cd <span class="path">/pagina</span><br>
    <span class="err">bash: cd: <span class="path">/pagina</span>: No such file or directory</span><br>
    <span class="dim"># 404 — página não encontrada</span>
  </h1>
  <a href="/">← voltar ao início</a>
</main>
<script>
  document.querySelectorAll('.path').forEach(el => { el.textContent = location.pathname; });
</script>
</body>
</html>
